name: Dependabot Auto-merge (reusable)

on:
  workflow_call:

# Every privileged step mints its own token from the APP_ID/APP_PRIVATE_KEY
# GitHub App via actions/create-github-app-token; the default GITHUB_TOKEN
# is never used and the repo is never checked out, so no permissions needed.
permissions: {}

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    # One run per repo at a time, so two PRs can't race to merge. GitHub keeps
    # only one *pending* run per group and cancels older pending ones; the
    # sweep step below recovers any PR dropped that way.
    concurrency:
      group: dependabot-automerge-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      # Skip major version bumps — those need a human eye
      - name: Skip major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "Major version bump — skipping auto-merge."

      - name: Approve PR
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # Required status checks (e.g. CI) run in parallel with this workflow and
      # may still be pending — merging before they finish is rejected by branch
      # protection. Wait for them here instead of relying on GitHub's native
      # auto-merge, since that requires the "Allow auto-merge" repo setting,
      # which isn't enabled on several repos this workflow runs against.
      # Repos without branch protection (e.g. private repos on the free plan)
      # report no required checks at all — `gh pr checks --required` exits 1
      # with "no required checks reported" in that case, which just means
      # there's nothing to wait for, so treat it as success.
      # Capture the exit status via `if`, not a bare assignment: Actions runs
      # `run:` blocks under `bash -e`, where `output=$(cmd)` inherits cmd's
      # status and aborts the step before the check below can run.
      - name: Wait for required checks
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          if output=$(gh pr checks "$PR_URL" --watch --required --fail-fast 2>&1); then
            status=0
          else
            status=$?
          fi
          echo "$output"
          if [ $status -ne 0 ] && ! grep -q "no required checks reported" <<<"$output"; then
            exit $status
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # GitHub's merge-eligibility cache can lag a few seconds behind the checks
      # API even after `gh pr checks --watch` reports everything passing, which
      # makes the merge mutation fail once with "N of N required status checks
      # are expected". Retry briefly to ride out that propagation delay.
      - name: Squash merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          for attempt in 1 2 3 4 5; do
            output=$(gh pr merge --squash "$PR_URL" 2>&1) && { echo "$output"; exit 0; }
            echo "$output"
            if ! grep -q "required status checks are expected" <<<"$output"; then
              exit 1
            fi
            sleep 10
          done
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # Dependabot only rebases on conflicts, not when a PR is merely behind
      # the base branch, so after one PR merges its siblings go stale and can't
      # merge under "require branches to be up to date". Ask Dependabot to
      # rebase the oldest stale one; its push re-triggers this workflow, which
      # merges it and sweeps again, so the backlog drains one PR at a time.
      # `@dependabot rebase` rather than the update-branch API: that adds a
      # merge commit, after which Dependabot treats the PR as hand-edited and
      # stops maintaining it. Runs even if the merge step failed, since the
      # failure may be this very PR being behind.
      - name: Rebase next stale Dependabot PR
        if: always() && steps.app-token.outcome == 'success'
        run: |
          # mergeStateStatus is UNKNOWN for a few seconds after a merge.
          for attempt in 1 2 3; do
            sleep 10
            prs=$(gh pr list --repo "$REPO" --author "app/dependabot" --state open \
              --json number,mergeStateStatus,createdAt)
            if ! grep -q '"UNKNOWN"' <<<"$prs"; then break; fi
          done
          next=$(jq -r '[.[] | select(.mergeStateStatus == "BEHIND" or .mergeStateStatus == "DIRTY")]
            | sort_by(.createdAt) | first | .number // empty' <<<"$prs")
          if [ -z "$next" ]; then
            echo "No stale Dependabot PRs."
            exit 0
          fi
          echo "Requesting rebase of #$next"
          gh pr comment "$next" --repo "$REPO" --body "@dependabot rebase"
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
